<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0"
    />

    <title>QuestSave — Download &amp; save videos from any social platform</title>
    <meta
      name="description"
      content="Paste a link from TikTok, YouTube, Instagram, Facebook, X, Pinterest, Threads, SoundCloud, Spotify, and more — or search YouTube by name. Save clips to your QuestSave library."
    />
    <meta
      name="keywords"
      content="QuestSave, video downloader, TikTok downloader, Instagram downloader, YouTube downloader, Facebook video download, Threads downloader, SoundCloud downloader, save social media videos, clip saver"
    />
    <meta name="author" content="QuestSave" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#FE6022" />
    <meta name="color-scheme" content="dark light" />

    <link rel="canonical" href="__SITE_URL__/" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QuestSave" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta
      property="og:title"
      content="QuestSave — Download media effortlessly from social platforms"
    />
    <meta
      property="og:description"
      content="Paste a TikTok, Instagram, YouTube, Facebook, X, Pinterest, Threads, SoundCloud, Spotify, or other supported link to download media — and save it to your library."
    />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="463" />
    <meta
      property="og:image:alt"
      content="QuestSave home screen: paste a social media link to download and save clips"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="QuestSave — Download media effortlessly from social platforms"
    />
    <meta
      name="twitter:description"
      content="Paste a TikTok, Instagram, YouTube, Facebook, X, Pinterest, Threads, SoundCloud, Spotify, or other supported link to download media — and save it to your library."
    />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="QuestSave home screen: paste a social media link to download and save clips"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "QuestSave",
        "url": "__SITE_URL__/",
        "description": "Download and save videos and images from TikTok, YouTube, Instagram, Facebook, X, Pinterest, Threads, SoundCloud, Spotify, and other supported platforms.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web",
        "browserRequirements": "Requires JavaScript",
        "image": "__SITE_URL__/og-image.png",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
